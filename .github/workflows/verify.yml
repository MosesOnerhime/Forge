name: Verify

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci > npm-install.log 2>&1; then
            cat npm-install.log
          else
            grep -E '^(npm error|npm ERR!)' npm-install.log | tail -n 10 | sed 's/^/::error::/' || true
            tail -n 5 npm-install.log | sed 's/^/::error::/'
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
