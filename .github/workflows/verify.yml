name: Verify

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci > npm-install.log 2>&1; then
            cat npm-install.log
          else
            head -n 10 npm-install.log | sed 's/^/::error::/'
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: forge_test
          POSTGRES_DB: forge_migration_test
        options: >-
          --health-cmd "pg_isready -U forge_test -d forge_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations and check owner isolation
        run: |
          for file in scripts/local_db_bootstrap.sql supabase/migrations/*.sql scripts/local_db_checks.sql; do
            echo "Checking $file"
            docker exec -i '${{ job.services.postgres.id }}' psql -X -v ON_ERROR_STOP=1 -U forge_test -d forge_migration_test < "$file"
          done
